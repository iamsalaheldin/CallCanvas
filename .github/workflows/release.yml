name: Release

# Publishes to npm when a version tag is pushed. The tag must equal package.json's version
# ("v1.2.3" ↔ "1.2.3"); CHANGELOG.md must have a section for it. Requires an npm granular access
# token in the NPM_TOKEN secret (or configure npm trusted publishing and drop the token).
# The same checks guard a manual release: `npm publish` runs prepublishOnly (scripts/release-check.mjs,
# then `npm run verify`) on a maintainer's machine exactly as it does here. See RELEASING.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write     # the GitHub release
  id-token: write     # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          [ "$tag" = "$version" ] || { echo "tag v$tag != package.json $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      # A manual release publishes first and pushes the tag afterwards; then only the GitHub release is made.
      - name: Already on npm?
        id: npm
        run: |
          published="$(npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version 2>/dev/null || true)"
          [ -n "$published" ] && echo "published=true" >> "$GITHUB_OUTPUT" || true
      # prepublishOnly runs scripts/release-check.mjs and `npm run verify` before anything is uploaded.
      - name: Publish to npm with provenance
        if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "v$version" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
